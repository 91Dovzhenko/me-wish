<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Боковое меню — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<nav aria-label="Навигация" style="position: relative; width: 260px; height: 100%; min-height: 936px; box-sizing: border-box; padding: 26px 14px 18px; background: {{navBg}}; border-radius: {{navRadius}}; box-shadow: {{navLine}}; display: flex; flex-direction: column; gap: 20px; font-family: Onest, sans-serif; color: #17181C">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div style="width: 36px; height: 36px; border-radius: 11px; background: #17181C; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" style="fill:#C8F56A" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"></path></svg></div>
<span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: -0.01em">ME:WISH</span>
</div>
<a href="Desktop-Home.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 12px; text-decoration: none; color: #17181C; font-size: 15px; font-weight: 600; background: {{homeBg}}"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></svg>Главная</a>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 12px 6px; font-size: 12px; font-weight: 700; color: #5E6066; letter-spacing: 0.04em; text-transform: uppercase">Мои списки</span>
<div style="position: relative; max-height: {{listMax}}; overflow: hidden; display: flex; flex-direction: column; gap: 2px"><sc-for list="{{lists}}" as="l" hint-placeholder-count="4"><a href="Desktop-List.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 12px; text-decoration: none; color: #17181C; font-size: 15px; font-weight: {{l.w}}; background: {{l.bg}}"><dc-import name="ListIcon" kind="{{l.icon}}" color="{{l.color}}" size="15" box="28" hint-size="28px,28px"></dc-import><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.title}}</span><span style="font-size: 13px; color: #5E6066">{{l.n}}</span></a></sc-for><sc-if value="{{many}}"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(180deg, rgba(255, 255, 255, 0), #FFFFFF)"></div><div aria-hidden="true" style="position: absolute; right: 0; top: 40px; width: 4px; height: 120px; border-radius: 999px; background: #D3D2CC"></div></sc-if></div>
<a href="Desktop-NewList.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 12px; text-decoration: none; color: #4B3BC4; font-size: 15px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 9px; border: 1.5px dashed #B9A8FF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" style="stroke:#4B3BC4;stroke-width:2.2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Новый список</a>
</div>
<a href="Desktop-ProfileMenu.dc.html" aria-haspopup="menu" aria-expanded="{{menuAria}}" style="margin-top: auto; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 10px; border-radius: 14px; text-decoration: none; color: #17181C; background: {{profBg}}"><span style="width: 32px; height: 32px; border-radius: 999px; background: linear-gradient(135deg, #B9A8FF, #8E78FF); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">ВД</span><span style="flex: 1; font-size: 14px; font-weight: 600; white-space: nowrap">Виталий</span><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#5E6066;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></a>

<sc-if value="{{menu}}">
<div role="menu" aria-label="Профиль" style="position: absolute; left: 14px; right: 14px; bottom: 80px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-shadow: 0 20px 50px rgba(23, 24, 28, 0.2), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column">
<a href="Desktop-Profile.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 12px; padding: 0 12px; background: #F4F4EF; color: #17181C; text-decoration: none; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"></path></svg>Профиль</a>
<a href="Desktop-Trash.dc.html" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; height: 44px; border-radius: 12px; padding: 0 12px; color: #17181C; text-decoration: none"><span style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Корзина</span><span style="font-size: 13px; color: #5E6066">3</span></a>
<div aria-hidden="true" style="height: 1px; background: #EEEDE8; margin: 4px 8px"></div>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 44px; border: none; border-radius: 12px; padding: 0 12px; background: none; font-family: Onest, sans-serif; font-size: 14px; color: #B42318; cursor: pointer; text-align: left"><svg width="17" height="17" viewBox="0 0 24 24" style="stroke:#B42318;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>Выйти</button>
</div>
</sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","list","none","profile"],"default":"home"},"menu":{"editor":"boolean","default":false},"hover":{"editor":"int","default":-1},"many":{"editor":"boolean","default":false},"first":{"editor":"boolean","default":false},"panel":{"editor":"enum","options":["none","line","white"],"default":"white"},"$preview":{"width":260,"height":936}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const menu = !!this.props.menu;
    const hoverIdx = this.props.hover ?? -1;
    const raw = [
      { title: 'Мои желания', icon: 'heart', color: 'lavender', n: 7 },
      { title: 'День рождения', icon: 'cake', color: 'pink', n: 8 },
      { title: 'Для поездок', icon: 'plane', color: 'blue', n: 2 },
      { title: 'Новый год', icon: 'tree', color: 'mint', n: 0 }
    ];
    const many = !!this.props.many;
    if (this.props.first) raw.splice(0, raw.length, { title: 'Мои желания', icon: 'heart', color: 'lavender', n: 0 });
    if (many) raw.push(
      { title: 'Для дома', icon: 'home', color: 'sand', n: 5 }, { title: 'Свадьба Ани и Миши', icon: 'ring', color: 'peach', n: 6 },
      { title: 'Для кухни', icon: 'pot', color: 'lime', n: 4 }, { title: 'Книги на лето', icon: 'book', color: 'gray', n: 9 },
      { title: 'Походы', icon: 'tent', color: 'mint', n: 3 }, { title: 'Для Барсика', icon: 'paw', color: 'pink', n: 2 },
      { title: 'Музыка и винил', icon: 'music', color: 'lavender', n: 7 }
    );
    const lists = raw.map((l, i) => ({ ...l, bg: (a === 'list' && i === 0) ? '#C8F56A' : (i === hoverIdx ? '#F4F4EF' : 'transparent'), w: (a === 'list' && i === 0) ? 600 : 500 }));
    return {
      navBg: (this.props.panel ?? 'white') === 'white' ? '#FFFFFF' : 'transparent', navRadius: (this.props.panel ?? 'white') === 'white' ? '28px' : '0', navLine: this.props.panel === 'line' ? 'inset -1px 0 0 #E2E1DB' : 'none',
      lists, menu, many, listMax: many ? '470px' : 'none', menuAria: menu ? 'true' : 'false',
      homeBg: a === 'home' ? '#C8F56A' : 'transparent',
      profileActive: a === 'profile',
      profBg: (menu || a === 'profile') ? '#F4F4EF' : 'transparent'
    };
  }
}
</script>
</body>
</html>
