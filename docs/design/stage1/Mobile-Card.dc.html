<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка — шторка (телефон)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true" style="padding: 58px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="height: 28px; width: 55%; border-radius: 10px; background: #E6E5DF"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="height: 250px; border-radius: 20px; background: #FFFFFF"></div><div style="height: 250px; border-radius: 20px; background: #FFFFFF"></div></div>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.35)"></div>

<section role="dialog" aria-label="Карточка желания" style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; background: #FFFFFF; border-radius: 32px 32px 0 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; z-index: 2; left: 50%; top: 10px; margin-left: -20px; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div>
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; overflow: hidden">
<div style="padding: 24px 20px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; transform: translateY({{shift}}px)">
<div style="position: relative; flex: none; width: 300px; align-self: center">
<dc-import name="Photo" p="{{p}}" radius="24" hint-size="300px,300px"></dc-import>
<sc-if value="{{noPhoto}}"><button type="button" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); height: 44px; padding: 0 16px; border: none; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 4px rgba(23, 24, 28, 0.14); font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; color: #17181C; white-space: nowrap; cursor: pointer">+ Добавить фото</button></sc-if>
<a href="Mobile-List.dc.html" aria-label="Закрыть" style="position: absolute; left: -16px; top: -8px; width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(23, 24, 28, 0.14)"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<a href="Mobile-Card-Menu.dc.html" aria-label="Ещё действия" style="position: absolute; right: -16px; top: -8px; width: 44px; height: 44px; border-radius: 999px; background: {{menuBg}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(23, 24, 28, 0.14)"><svg width="20" height="20" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:3;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></a>
<sc-if value="{{isDone}}"><span style="position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 5px; background: #17181C; color: #FFFFFF; font-size: 12px; font-weight: 700; padding: 5px 10px 5px 8px; border-radius: 999px"><svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#C8F56A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{statusLabel}}</span></sc-if>
</div>

<h1 style="margin: 2px 0 0; font-size: 21px; font-weight: 700; line-height: 1.28; letter-spacing: -0.01em">{{title}}</h1>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: -6px">
<sc-if value="{{hasPrice}}" hint-placeholder-val="{{ true }}"><span style="font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap">{{price}}</span></sc-if><sc-if value="{{noPrice}}"><button type="button" style="height: 40px; padding: 0 12px; border: 1.5px dashed #C9C7FF; border-radius: 12px; background: #F7F5FF; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; color: #4B3BC4; white-space: nowrap; cursor: pointer">+ Указать цену</button></sc-if>
<a href="Mobile-Card-Priority.dc.html" aria-label="Приоритет: {{levelLabel}}. Изменить" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; margin-right: -10px; border-radius: 12px; background: {{prioBg}}; text-decoration: none; white-space: nowrap"><dc-import name="Hearts" level="{{level}}" size="14" gap="0" hint-size="70px,14px"></dc-import><span style="font-size: 14px; font-weight: 600; color: #4B3BC4">{{levelLabel}}</span><svg width="14" height="14" viewBox="0 0 24 24" style="stroke:#4B3BC4;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<sc-if value="{{showPrio}}">
<div role="listbox" aria-label="Приоритет" style="position: absolute; z-index: 5; right: -10px; top: 50px; width: 250px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-shadow: 0 16px 40px rgba(23, 24, 28, 0.2), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column">
<sc-for list="{{prios}}" as="o" hint-placeholder-count="5"><button type="button" role="option" aria-selected="{{o.sel}}" style="display: flex; align-items: center; gap: 10px; height: 46px; border: none; border-radius: 12px; padding: 0 10px; background: {{o.bg}}; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="Hearts" level="{{o.n}}" size="13" gap="0" hint-size="65px,13px"></dc-import><span style="flex: 1; font-size: 14px; font-weight: {{o.w}}; white-space: nowrap">{{o.t}}</span><sc-if value="{{o.on}}"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
</div>
</sc-if>
</div>

<sc-if value="{{hasDesc}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 15px; line-height: 1.45; overflow: hidden; display: -webkit-box; -webkit-line-clamp: {{clamp}}; -webkit-box-orient: vertical">{{desc}}</p>
<sc-if value="{{collapsed}}"><a href="Mobile-Card-Long.dc.html" style="align-self: flex-start; padding: 4px 0; font-size: 14px; font-weight: 600; color: #4B3BC4; text-decoration: none">Ещё</a></sc-if>
<sc-if value="{{expanded}}"><button type="button" style="align-self: flex-start; border: none; background: none; padding: 4px 0; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; color: #4B3BC4; cursor: pointer">Свернуть</button></sc-if>
</div></sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<span id="st" style="font-size: 12px; color: #5E6066">Статус</span>
<a href="Mobile-Card-Status.dc.html" aria-labelledby="st" style="display: flex; align-items: center; justify-content: space-between; height: 50px; box-sizing: border-box; border: 1.5px solid {{statusBorder}}; border-radius: 14px; padding: 0 14px; color: #17181C; text-decoration: none; font-size: 15px; font-weight: 600">{{statusLabel}}<svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="{{chevron}}"></path></svg></a>
<sc-if value="{{showStatus}}">
<div role="listbox" aria-label="Статус" style="border-radius: 16px; padding: 6px; background: #FFFFFF; box-shadow: 0 14px 34px rgba(23, 24, 28, 0.16), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column">
<sc-for list="{{statuses}}" as="o" hint-placeholder-count="3"><button type="button" role="option" aria-selected="{{o.sel}}" style="display: flex; align-items: center; justify-content: space-between; height: 46px; border: none; border-radius: 12px; padding: 0 12px; background: {{o.bg}}; font-family: Onest, sans-serif; font-size: 15px; font-weight: {{o.w}}; color: #17181C; cursor: pointer; text-align: left">{{o.t}}<sc-if value="{{o.on}}"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
</div>
</sc-if>
</div>
<p style="margin: 0; font-size: 13px; color: #5E6066">В списке «Мои желания» · добавлено 12 ноября</p>
</div>
</div>

<sc-if value="{{hasLink}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; background: #FFFFFF; box-shadow: 0 -1px 0 #EEEDE8">
<a href="https://market.yandex.ru/card/shtativ-kf-concept-k254a7-s-videogolovoy-fh-03/4766393824" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 18px; background: #C8F56A; color: #17181C; text-decoration: none; font-size: 17px; font-weight: 700">Перейти в магазин<svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
</div></sc-if>

<sc-if value="{{showMenu}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.12)"></div>
<div role="menu" aria-label="Действия с карточкой" style="position: absolute; right: 30px; top: 82px; width: 220px; background: #FFFFFF; border-radius: 20px; padding: 6px; box-shadow: 0 16px 40px rgba(23, 24, 28, 0.2); display: flex; flex-direction: column">
<a href="Mobile-Add.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 46px; border-radius: 14px; padding: 0 12px; font-size: 15px; color: #17181C; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"></path></svg>Редактировать</a>
<a href="Mobile-Card-Move.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 46px; border-radius: 14px; padding: 0 12px; font-size: 15px; color: #17181C; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6"></path></svg>Переместить</a>
<div aria-hidden="true" style="height: 1px; background: #EEEDE8; margin: 4px 8px"></div>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; height: 46px; border: none; border-radius: 14px; padding: 0 12px; background: none; font-family: Onest, sans-serif; font-size: 15px; color: #B42318; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#B42318;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Удалить</button>
</div>
</sc-if>

<sc-if value="{{showMove}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.35)"></div>
<div role="dialog" aria-label="Переместить в список" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 10px">
<div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div>
<h2 style="margin: 4px 4px 2px; font-size: 18px; font-weight: 700">Переместить в список</h2>
<sc-for list="{{lists}}" as="l" hint-placeholder-count="4"><button type="button" style="display: flex; align-items: center; gap: 12px; height: 56px; border: none; border-radius: 16px; padding: 0 10px; background: {{l.bg}}; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="ListIcon" kind="{{l.icon}}" color="{{l.color}}" size="16" box="34" hint-size="34px,34px"></dc-import><span style="flex: 1; font-size: 15px; font-weight: 600">{{l.title}}</span><span style="font-size: 13px; color: #5E6066">{{l.n}}</span><sc-if value="{{l.cur}}"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
</div>
</sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Штатив K&amp;F Concept K254A7 с видеоголовой FH-03"},"price":{"editor":"text","default":"11 990 ₽"},"p":{"editor":"text","default":"p1"},"level":{"editor":"int","min":1,"max":5,"default":5},"desc":{"editor":"text","default":"Нужен именно с видеоголовой — для съёмки роликов. Высота до 1,8 м, чтобы снимать стоя. Можно другой цвет, если этого не будет в наличии. Центральная колонна должна вставать горизонтально — для съёмки сверху. Подойдёт и б/у в хорошем состоянии."},"status":{"editor":"enum","options":["active","purchased","gifted"],"default":"active"},"descMode":{"editor":"enum","options":["collapsed","expanded","short"],"default":"collapsed"},"overlay":{"editor":"enum","options":["none","status","menu","move","priority"],"default":"none"},"shift":{"editor":"int","default":0},"link":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = { 1: 'Можно и без', 2: 'Было бы неплохо', 3: 'Хочу', 4: 'Очень хочу', 5: 'Мечта' };
    const st = this.props.status ?? 'active';
    const stLabel = { active: 'В желаниях', purchased: 'Куплено', gifted: 'Подарили' };
    const level = this.props.level ?? 5;
    const ov = this.props.overlay ?? 'none';
    const mode = this.props.descMode ?? 'collapsed';
    const statuses = ['active', 'purchased', 'gifted'].map((k) => ({
      t: stLabel[k], on: k === st, sel: k === st ? 'true' : 'false', bg: k === st ? '#F4F4EF' : 'transparent', w: k === st ? 600 : 400
    }));
    return {
      title: this.props.title ?? 'Штатив K&F Concept K254A7 с видеоголовой FH-03',
      price: this.props.price ?? '11 990 ₽',
      p: this.props.p ?? 'p1',
      desc: this.props.desc ?? 'Нужен именно с видеоголовой — для съёмки роликов. Высота до 1,8 м, чтобы снимать стоя. Можно другой цвет, если этого не будет в наличии. Центральная колонна должна вставать горизонтально — для съёмки сверху. Подойдёт и б/у в хорошем состоянии.',
      level, levelLabel: labels[level],
      isDone: st !== 'active', statusLabel: stLabel[st],
      statuses,
      clamp: mode === 'collapsed' ? 4 : 'unset',
      collapsed: mode === 'collapsed', expanded: mode === 'expanded',
      showStatus: ov === 'status', showMenu: ov === 'menu', showMove: ov === 'move',
      statusBorder: ov === 'status' ? '#17181C' : '#E2E1DB',
      chevron: ov === 'status' ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
      menuBg: ov === 'menu' ? '#EEE9FF' : '#FFFFFF',
      shift: this.props.shift ?? 0,
      noPhoto: (this.props.p ?? 'p1') === '',
      hasPrice: (this.props.price ?? '11 990 ₽') !== '', noPrice: (this.props.price ?? '11 990 ₽') === '',
      hasDesc: (this.props.desc ?? 'x') !== '',
      hasLink: this.props.link ?? true,
      showPrio: ov === 'priority', prioBg: ov === 'priority' ? '#EEE9FF' : 'transparent',
      prios: [5, 4, 3, 2, 1].map((n) => ({ n, t: labels[n], on: n === level, sel: n === level ? 'true' : 'false', bg: n === level ? '#F4F4EF' : 'transparent', w: n === level ? 600 : 400 })),
      lists: [
        { title: 'Мои желания', icon: 'heart', color: 'lavender', n: '7 желаний', cur: true, bg: '#F4F4EF' },
        { title: 'День рождения', icon: 'cake', color: 'pink', n: '8 желаний', cur: false, bg: 'transparent' },
        { title: 'Для поездок', icon: 'plane', color: 'blue', n: '2 желания', cur: false, bg: 'transparent' },
        { title: 'Новый год', icon: 'tree', color: 'mint', n: 'пусто', cur: false, bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
