<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Корзина — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="position: relative; width: 100%; min-height: 960px; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C; padding: 12px; display: flex; gap: 12px">
<div style="flex: none; display: flex"><dc-import name="Sidebar" active="none" hint-size="260px,936px"></dc-import></div>
<main style="flex: 1; min-width: 0; box-sizing: border-box; background: transparent; border-radius: 32px; padding: 36px 32px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">Корзина</h1>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 14px; color: #5E6066">Удалённые желания хранятся 30 дней, потом исчезают навсегда.</p></sc-if>
</div>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}"><button type="button" style="height: 44px; padding: 0 16px; border: 1.5px solid #F3C9C4; border-radius: 14px; background: #FFFFFF; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; color: #B42318; cursor: pointer">Очистить корзину</button></sc-if>
</header>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px; max-width: 760px">
<sc-for list="{{items}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 16px; padding: 10px; border-radius: 20px; background: #FFFFFF">
<div style="width: 72px; flex: none"><dc-import name="Photo" p="{{t.p}}" radius="14" hint-size="72px,72px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.title}}</span><span style="font-size: 13px; color: #5E6066">Из «{{t.list}}» · удалится через {{t.days}}</span></div>
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 14px; background: #EEE9FF; color: #4B3BC4; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer">Восстановить</button>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isEmpty}}"><div style="margin-top: 20px; max-width: 760px; background: #FFFFFF; border-radius: 28px; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center"><span style="width: 72px; height: 72px; border-radius: 24px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" style="stroke:#8A8B90;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></span><span style="font-size: 20px; font-weight: 700">Корзина пуста</span><span style="font-size: 15px; color: #5E6066; max-width: 320px; line-height: 1.45">Удалённые желания появятся здесь и будут храниться 30 дней</span></div></sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { isEmpty: !!this.props.empty, hasItems: !this.props.empty, items: [
      { title: 'Очки солнцезащитные, чёрные', list: 'Для поездок', days: '27 дн.', p: 'p2' },
      { title: 'Карабины алюминиевые, 5 шт.', list: 'Мои желания', days: '12 дн.', p: 'p5' },
      { title: 'Билеты на концерт', list: 'День рождения', days: '3 дн.', p: '' }
    ] };
  }
}
</script>
</body>
</html>
