<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вход — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true" style="position: absolute; left: -80px; right: -80px; top: -120px; height: 560px; background: radial-gradient(60% 55% at 70% 40%, rgba(185, 168, 255, 0.75), rgba(185, 168, 255, 0) 70%), radial-gradient(45% 40% at 20% 60%, rgba(200, 245, 106, 0.55), rgba(200, 245, 106, 0) 70%)"></div>
<sc-if value="{{noInvite}}" hint-placeholder-val="{{ true }}"><div aria-hidden="true" style="position: absolute; left: 34px; top: 130px; width: 150px; transform: rotate(-7deg)"><dc-import name="WishCard" title="Штатив K&amp;F Concept K254A7" price="11 990 ₽" p="p1" level="5" status="active" hint-size="150px,240px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; right: 30px; top: 190px; width: 150px; transform: rotate(6deg)"><dc-import name="WishCard" title="Очки солнцезащитные AH MEE" price="1 290 ₽" p="p2" level="3" status="active" hint-size="150px,240px"></dc-import></div></sc-if>
<sc-if value="{{invite}}"><div style="position: absolute; left: 20px; right: 20px; top: 110px"><dc-import name="InviteCard" mode="login" w="350" hint-size="350px,230px"></dc-import></div></sc-if>
<div style="position: absolute; left: 24px; right: 24px; bottom: 40px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 44px; height: 44px; border-radius: 14px; background: #17181C; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" style="fill:#C8F56A" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"></path></svg></div>
<span style="font-family: Unbounded, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.03em">ME:WISH</span>
</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em">Все желания — в одном месте</h1>
<p style="margin: 0 0 8px; font-size: 15px; color: #5E6066; line-height: 1.45">Скриншот, название, цена — и желание сохранено. Делитесь списками с близкими.</p>
<sc-if value="{{isNormal}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 14px"><button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: none; border-radius: 18px; background: #17181C; color: #FFFFFF; font-family: Onest, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" style="fill:#FFFFFF" aria-hidden="true"><path d="M21.5 4.2L2.9 11.4c-1 .4-1 1.6.1 1.9l4.6 1.4 1.8 5.5c.3.8 1.2 1 1.8.4l2.6-2.4 4.8 3.5c.7.5 1.6.1 1.8-.7l3.2-15.2c.2-1-.8-1.8-1.9-1.4zM9.6 14.2l8.2-6.4-6.6 7.4-.3 3-1.3-4z"></path></svg>Войти через Telegram</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: 1.5px solid #D9D8D2; border-radius: 18px; background: #FFFFFF; color: #17181C; font-family: Onest, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer"><span style="font-weight: 700; font-size: 18px; color: #4B3BC4">G</span>Войти через Google</button></div></sc-if>
<sc-if value="{{isLoading}}"><div role="status" style="height: 126px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; border-radius: 20px; background: #FFFFFF"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 999px; border: 3px solid #E6E5DF; border-top-color: #17181C; box-sizing: border-box"></span><span style="font-size: 16px; font-weight: 600">Входим…</span></div></sc-if>
<sc-if value="{{isError}}"><div style="display: flex; flex-direction: column; gap: 12px"><div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: #FFF1EF; color: #B42318; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" style="flex: none; stroke:#B42318;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M12 8v5M12 16.5h.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path></svg>Не получилось войти. Попробуйте ещё раз.</div><button type="button" style="height: 56px; border: none; border-radius: 18px; background: #17181C; color: #FFFFFF; font-family: Onest, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Попробовать ещё раз</button></div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["normal","loading","error"],"default":"normal"},"invite":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'normal';
    return { invite: !!this.props.invite, noInvite: !this.props.invite, isNormal: st === 'normal', isLoading: st === 'loading', isError: st === 'error' };
  }
}
</script>
</body>
</html>
