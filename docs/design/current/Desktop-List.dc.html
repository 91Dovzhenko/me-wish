<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Список — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 100%; min-height: 960px; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C; padding: 12px; display: flex; gap: 12px">
<div style="flex: none; display: flex"><dc-import name="Sidebar" active="{{sbActive}}" sections="{{isShared}}" shared-active="{{isShared}}" hint-size="260px,936px"></dc-import></div>
<main style="position: relative; flex: 1; min-width: 0; box-sizing: border-box; background: transparent; border-radius: 32px; padding: 36px 32px 48px; display: flex; flex-direction: column; gap: 18px">
<header style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
<div style="display: flex; align-items: center; gap: 12px">
<dc-import name="ListIcon" kind="{{lIcon}}" color="{{lColor}}" size="20" box="40" hint-size="40px,40px"></dc-import>
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap">{{lTitle}}</h1>
<sc-if value="{{isShared}}"><a href="Shared-Members-Desktop.dc.html" aria-label="Участники: Виталий, Олеся" style="display: inline-flex; align-items: center; height: 44px; padding: 0 4px"><dc-import name="AvatarStack" who="{{members}}" size="30" ring="#F4F4EF" hint-size="52px,30px"></dc-import></a></sc-if>
<button type="button" aria-label="Меню списка" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 999px; background: {{menuBg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:3;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>
<sc-if value="{{hasDesc}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 15px; color: #5E6066">{{lDesc}}</p></sc-if><sc-if value="{{loading}}"><div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px"><div style="width: 260px; height: 14px; border-radius: 7px; background: #E6E5DF"></div><div style="width: 320px; height: 14px; border-radius: 7px; background: #E9E9E3"></div></div></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><p aria-label="Сводка списка" style="margin: 0; font-size: 14px; color: #5E6066">Активные <b style="color: #17181C; font-weight: 600">5 · 24 760 ₽</b><span aria-hidden="true" style="margin: 0 10px; color: #C9C8C2">|</span><span style="white-space: nowrap">Исполнено <b style="color: #17181C; font-weight: 600">2 · 1 339 ₽</b></span></p></sc-if>
</div>
<a href="Desktop-Add.dc.html" style="white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 16px; background: #C8F56A; color: #17181C; text-decoration: none; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Добавить желание</a>
</header>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<button type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; border: none; background: {{sortBg}}; border-radius: 999px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; color: #17181C; white-space: nowrap; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>По приоритету</button>
<button type="button" role="switch" aria-checked="true" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; border: none; border-radius: 999px; padding: 0 14px 0 8px; background: #FFFFFF; color: #17181C; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 999px; background: #C8F56A; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none"><path d="M5 12l5 5 9-10"></path></svg></span>Исполненные</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px">
<sc-for list="{{wishes}}" as="w" hint-placeholder-count="5"><dc-import name="WishCard" title="{{w.title}}" price="{{w.price}}" p="{{w.p}}" level="{{w.level}}" status="{{w.state}}" by="{{w.by}}" href="Desktop-Card.dc.html" hint-size="100%,310px"></dc-import></sc-for>
</div>
<h2 style="margin: 10px 0 0; font-size: 18px; font-weight: 700">Исполнено <span style="color: #5E6066; font-weight: 500">· 2</span></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px">
<sc-for list="{{done}}" as="w" hint-placeholder-count="2"><dc-import name="WishCard" title="{{w.title}}" price="{{w.price}}" p="{{w.p}}" level="{{w.level}}" status="{{w.state}}" by="{{w.by}}" href="Desktop-Card.dc.html" hint-size="100%,310px"></dc-import></sc-for>
</div>
</sc-if>
<sc-if value="{{loading}}"><div aria-hidden="true" style="display: flex; gap: 10px"><div style="width: 150px; height: 40px; border-radius: 999px; background: #E6E5DF"></div><div style="width: 150px; height: 40px; border-radius: 999px; background: #E6E5DF"></div></div><div aria-hidden="true" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px"><sc-for list="{{skel}}" as="k" hint-placeholder-count="5"><div style="background: #FFFFFF; border-radius: 20px; padding: 6px 6px 12px; display: flex; flex-direction: column; gap: 8px"><div style="aspect-ratio: 1 / 1; border-radius: 15px; background: #EEEDE8"></div><div style="margin: 0 6px; height: 15px; width: 45%; border-radius: 7px; background: #EEEDE8"></div><div style="margin: 0 6px; height: 11px; width: 85%; border-radius: 5px; background: #F2F1EC"></div><div style="margin: 0 6px; height: 11px; width: 60%; border-radius: 5px; background: #F2F1EC"></div></div></sc-for></div></sc-if>
<sc-if value="{{empty}}"><div style="margin-top: 20px; background: #FFFFFF; border-radius: 28px; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center"><dc-import name="ListIcon" kind="heart" color="lavender" size="28" box="60" hint-size="60px,60px"></dc-import><span style="font-size: 22px; font-weight: 700">Здесь пока пусто</span><span style="font-size: 15px; color: #5E6066; line-height: 1.45">Добавьте первое желание — хватит названия.<br>Фото и ссылку можно добавить потом.</span><a href="Desktop-Add.dc.html" style="margin-top: 8px; height: 50px; display: inline-flex; align-items: center; padding: 0 22px; border-radius: 16px; background: #17181C; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600; white-space: nowrap">Добавить первое желание</a></div></sc-if>
<sc-if value="{{showSort}}">
<div role="listbox" aria-label="Сортировка" style="position: absolute; z-index: 5; left: 40px; top: 232px; width: 250px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-shadow: 0 16px 40px rgba(23, 24, 28, 0.18), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column">
<sc-for list="{{sorts}}" as="o" hint-placeholder-count="5"><button type="button" role="option" aria-selected="{{o.sel}}" style="display: flex; align-items: center; justify-content: space-between; height: 44px; border: none; border-radius: 12px; padding: 0 12px; background: {{o.bg}}; font-family: Onest, sans-serif; font-size: 14px; font-weight: {{o.w}}; color: #17181C; cursor: pointer; text-align: left; white-space: nowrap">{{o.t}}<sc-if value="{{o.on}}"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for>
</div>
</sc-if>
<sc-if value="{{showMenu}}">
<div role="menu" aria-label="Меню списка" style="position: absolute; z-index: 5; left: 360px; top: 84px; width: 210px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-shadow: 0 16px 40px rgba(23, 24, 28, 0.18), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column">
<a href="Desktop-ListSettings.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 44px; border-radius: 12px; padding: 0 12px; background: #F4F4EF; font-size: 14px; color: #17181C; text-decoration: none"><svg width="17" height="17" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"></path></svg>Редактировать</a>
<div aria-hidden="true" style="height: 1px; background: #EEEDE8; margin: 4px 8px"></div>
<button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 44px; border: none; border-radius: 12px; padding: 0 12px; background: none; font-family: Onest, sans-serif; font-size: 14px; color: #B42318; cursor: pointer"><svg width="17" height="17" viewBox="0 0 24 24" style="stroke:#B42318;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Удалить</button>
</div>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"overlay":{"editor":"enum","options":["none","sort","menu"],"default":"none"},"state":{"editor":"enum","options":["normal","loading","empty"],"default":"normal"},"shared":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const ov = this.props.overlay ?? 'none';
    const isSh = !!this.props.shared;
    const sorts = ['По приоритету', 'Сначала дешёвые', 'Сначала дорогие', 'По дате добавления', 'По статусу'].map((t, i) => ({ t, on: i === 0, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#F4F4EF' : 'transparent', w: i === 0 ? 600 : 400 }));
    return {
      showSort: ov === 'sort', showMenu: ov === 'menu', sorts,
      isShared: isSh, sbActive: isSh ? 'none' : 'list', members: ['vitaly', 'olesya'],
      lTitle: isSh ? 'Для дома' : 'Мои желания', lIcon: isSh ? 'home' : 'heart', lColor: isSh ? 'sand' : 'lavender',
      lDesc: isSh ? 'Всё для квартиры — выбираем вместе' : 'Всё, что хочется себе — без повода',
      ready: (this.props.state ?? 'normal') === 'normal', loading: this.props.state === 'loading', empty: this.props.state === 'empty', hasDesc: (this.props.state ?? 'normal') === 'normal', skel: [1, 2, 3, 4, 5],
      sortBg: ov === 'sort' ? '#EEE9FF' : '#FFFFFF',
      menuBg: ov === 'menu' ? '#EEE9FF' : '#FFFFFF',
      wishes: isSh ? [
        { title: 'Штатив K&F Concept K234A0 с шаровой головой', price: '6 490 ₽', p: 'p6', level: 4, state: 'active', by: 'olesya' },
        { title: 'Штатив K&F Concept K254A7 с видеоголовой FH-03', price: '11 990 ₽', p: 'p1', level: 5, state: 'active', by: 'vitaly' },
        { title: 'Клетка SmallRig 3538B для Sony ZV-E10', price: '4 990 ₽', p: 'p3', level: 3, state: 'active', by: 'olesya' },
        { title: 'Очки квадратные, голубая оправа', price: '990 ₽', p: 'p4', level: 3, state: 'active', by: 'vitaly' }
      ] : [
        { title: 'Штатив K&F Concept K254A7 с видеоголовой FH-03', price: '11 990 ₽', p: 'p1', level: 5, state: 'active' },
        { title: 'Клетка SmallRig 3538B для Sony ZV-E10', price: '4 990 ₽', p: 'p3', level: 4, state: 'active' },
        { title: 'Солнцезащитные очки AH MEE, чёрные', price: '1 290 ₽', p: 'p2', level: 3, state: 'active' },
        { title: 'Сертификат на массаж спины', price: '', p: '', level: 3, state: 'active' },
        { title: 'Штатив K&F Concept K234A0 с шаровой головой BH-28L', price: '6 490 ₽', p: 'p6', level: 3, state: 'active' }
      ],
      done: [
        { title: 'Карабины алюминиевые, 5 шт.', price: '349 ₽', p: 'p5', level: 2, state: 'gifted' },
        { title: 'Очки квадратные, голубая оправа', price: '990 ₽', p: 'p4', level: 2, state: 'purchased' }
      ]
    };
  }
}
</script>
</body>
</html>
