<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Диалог подтверждения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="alertdialog" aria-label="{{title}}" style="width: {{w}}px; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: 24px; font-family: Onest, sans-serif; color: #17181C; box-shadow: 0 30px 80px rgba(23, 24, 28, 0.3); display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.3">{{title}}</h2>
<sc-if value="{{hasBody}}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5E6066">{{body}}</p></sc-if>
<sc-if value="{{hasSelect}}"><button type="button" aria-haspopup="listbox" style="margin-top: 6px; display: flex; align-items: center; gap: 10px; height: 52px; border: 1.5px solid #E2E1DB; border-radius: 14px; background: #FFFFFF; padding: 0 12px 0 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="ListIcon" kind="heart" color="lavender" size="15" box="32" hint-size="32px,32px"></dc-import><span style="flex: 1; font-size: 15px; font-weight: 600">Мои желания</span><span style="font-size: 12px; color: #5E6066">По умолчанию</span><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<div style="display: flex; gap: 8px; margin-top: 10px">
<button type="button" style="flex: 1; height: 50px; border: none; border-radius: 16px; background: #F4F4EF; font-family: Onest, sans-serif; font-size: 15px; font-weight: 600; color: #17181C; cursor: pointer; white-space: nowrap">{{secondary}}</button>
<button type="button" style="flex: 1; height: 50px; border: none; border-radius: 16px; background: {{pBg}}; font-family: Onest, sans-serif; font-size: 15px; font-weight: 700; color: {{pFg}}; cursor: pointer; white-space: nowrap">{{primary}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Не сохранять желание?"},"body":{"editor":"text","default":"Введённые данные пропадут."},"primary":{"editor":"text","default":"Не сохранять"},"secondary":{"editor":"text","default":"Продолжить"},"danger":{"editor":"boolean","default":true},"select":{"editor":"boolean","default":false},"w":{"editor":"int","default":342},"$preview":{"width":342,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const body = this.props.body ?? 'Введённые данные пропадут.';
    const danger = this.props.danger ?? true;
    return {
      title: this.props.title ?? 'Не сохранять желание?', body, hasBody: body !== '',
      primary: this.props.primary ?? 'Не сохранять', secondary: this.props.secondary ?? 'Продолжить',
      pBg: danger ? '#B42318' : '#C8F56A', pFg: danger ? '#FFFFFF' : '#17181C',
      hasSelect: !!this.props.select, w: this.props.w ?? 342
    };
  }
}
</script>
</body>
</html>
