<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка приглашения</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section aria-label="Приглашение в список" style="width: {{w}}; box-sizing: border-box; background: #FFFFFF; border-radius: 28px; padding: {{pad}}; font-family: Onest, sans-serif; color: #17181C; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 50px rgba(75, 59, 196, 0.12)">
<sc-if value="{{valid}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: {{coverW}}px; flex: none"><dc-import name="Cover" title="Для дома" meta="6 желаний" photos="{{photos}}" icon="home" color="sand" h="{{coverH}}" href="Shared-List-Mobile.dc.html" hint-size="100%,200px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px"><dc-import name="Avatar" who="vitaly" size="28" hint-size="28px,28px"></dc-import><span style="font-size: 13px; color: #5E6066">Виталий приглашает вас</span></div>
<span style="font-size: 20px; font-weight: 700; line-height: 1.25">в «Для дома»</span>
</div>
</div>
<div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #F5F2FF; color: #4B3BC4; font-size: 13px; line-height: 1.35; max-width: 100%; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; margin-top: 1px; stroke:#4B3BC4;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="{{roleIcon}}"></path></svg><span style="min-width: 0; overflow-wrap: anywhere"><b style="font-weight: 700">{{roleName}}</b> · {{roleText}}</span></div>
<sc-if value="{{actions}}"><div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px"><a href="Main.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #F4F4EF; color: #17181C; text-decoration: none; font-size: 15px; font-weight: 600">Не сейчас</a><a href="Shared-Joined.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #C8F56A; color: #17181C; text-decoration: none; font-size: 16px; font-weight: 700">Принять</a></div></sc-if>
<sc-if value="{{loginNote}}"><span style="font-size: 13px; color: #5E6066">Войдите, чтобы принять приглашение</span></sc-if>
</sc-if>
<sc-if value="{{expired}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 10px 6px; text-align: center"><span style="width: 64px; height: 64px; border-radius: 22px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" style="stroke:#8A8B90;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1M3 3l18 18"></path></svg></span><span style="font-size: 19px; font-weight: 700">Приглашение больше не действует</span><span style="font-size: 14px; color: #5E6066; line-height: 1.45">Попросите прислать новое — ссылка действует 7 дней и её могли отозвать.</span><a href="Main.dc.html" style="margin-top: 6px; height: 50px; display: inline-flex; align-items: center; padding: 0 22px; border-radius: 16px; background: #17181C; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">На главную</a></div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["card","login","expired"],"default":"card"},"role":{"editor":"enum","options":["editor","viewer"],"default":"editor"},"w":{"editor":"int","default":350},"$preview":{"width":350,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mode ?? 'card';
    return {
      ...((this.props.role ?? 'editor') === 'viewer'
        ? { roleName: 'Зритель', roleText: 'только смотрит', roleIcon: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z' }
        : { roleName: 'Редактор', roleText: 'добавляет и меняет желания', roleIcon: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4' }),
      valid: m !== 'expired', expired: m === 'expired', actions: m === 'card', loginNote: m === 'login',
      photos: ['p6', 'p1', 'p3', 'p4'], w: (this.props.w ?? 350) + 'px', pad: m === 'login' ? '14px' : '18px',
      coverW: m === 'login' ? 110 : 130, coverH: m === 'login' ? 80 : 100
    };
  }
}
</script>
</body>
</html>
