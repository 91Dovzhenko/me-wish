<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новое желание — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.35)"></div>
<section role="dialog" aria-label="Новое желание" style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; background: #FFFFFF; border-radius: 32px 32px 0 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; z-index: 2; left: 50%; top: 10px; margin-left: -20px; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div>
<div style="padding: 24px 20px 110px; display: flex; flex-direction: column; gap: 14px; transform: translateY({{shift}}px)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">{{heading}}</h2>
<a href="Main.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<sc-if value="{{showPhoto}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="position: relative; width: 120px; flex: none"><dc-import name="Photo" p="p1" radius="18" hint-size="120px,120px"></dc-import><sc-if value="{{uploading}}"><div role="progressbar" aria-label="Фото загружается" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="position: absolute; inset: 0; border-radius: 18px; background: rgba(255, 255, 255, 0.72); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px"><span style="font-size: 14px; font-weight: 700">64%</span><span style="width: 80px; height: 6px; border-radius: 999px; background: #E6E5DF; overflow: hidden"><span style="display: block; width: 64%; height: 100%; background: #17181C; border-radius: 999px"></span></span></div></sc-if></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<a href="Mobile-Crop.dc.html" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 14px; background: #F4F4EF; color: #17181C; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"></path></svg>Обрезать</a>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: none; border-radius: 14px; background: #F4F4EF; color: #17181C; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 9"></path></svg>Другое фото</button>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: none; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #F3C9C4; color: #B42318; font-family: Onest, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#B42318;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>Удалить фото</button>
</div>
</div>
<sc-if value="{{smallWarn}}"><div role="status" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #FFF6E5; color: #8A5A00; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; stroke:#8A5A00;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>Фото маленькое — может быть нечётким</div></sc-if>
</div>
</sc-if>
<sc-if value="{{noPhoto}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<a href="Mobile-Crop.dc.html" style="display: flex; align-items: center; gap: 14px; height: 120px; box-sizing: border-box; padding: 0 18px; border: 1.5px dashed {{dropBorder}}; border-radius: 20px; background: #F7F5FF; color: #17181C; text-decoration: none">
<span style="width: 56px; height: 56px; flex: none; border-radius: 18px; background: #EEE9FF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" style="stroke:#4B3BC4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 9"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 16px; font-weight: 700">Добавить фото</span><span style="font-size: 13px; color: #5E6066; line-height: 1.35">JPG, PNG или HEIC до 20 МБ.<br>Подойдёт скриншот</span></span>
</a>
<sc-if value="{{photoErr}}"><div role="alert" style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #FFF1EF; color: #B42318; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" style="flex: none; stroke:#B42318;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M12 8v5M12 16.5h.01M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"></path></svg>{{photoErrText}}</div></sc-if>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t" style="font-size: 13px; font-weight: 600">Название <span aria-hidden="true" style="color: #D92D20">*</span></label>
<input id="t" type="text" required aria-invalid="{{nameInvalid}}" value="{{titleVal}}" placeholder="Что вы хотите?" style="height: 50px; box-sizing: border-box; border: 1.5px solid {{nameBorder}}; background: {{nameBg}}; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C">
<sc-if value="{{nameError}}"><span style="font-size: 13px; color: #B42318">Напишите, что вы хотите</span></sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p" style="font-size: 13px; font-weight: 600">Цена</label>
<div style="position: relative">
<input id="p" type="text" inputmode="numeric" value="{{priceVal}}" placeholder="0" style="width: 100%; height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 40px 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C; background: #FFFFFF">
<span aria-hidden="true" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 600; color: #5E6066">₽</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u" style="font-size: 13px; font-weight: 600">Ссылка на товар</label>
<input id="u" type="url" value="{{urlVal}}" placeholder="Чтобы подарили именно этот товар" style="height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 15px; color: #17181C; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="d" style="font-size: 13px; font-weight: 600">Описание</label>
<sc-if value="{{filled}}" hint-placeholder-val="{{ true }}"><textarea id="d" rows="2" placeholder="Размер, цвет, модель, пожелания" style="box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 12px 14px; font-family: Onest, sans-serif; font-size: 15px; line-height: 1.4; color: #17181C; background: #FFFFFF; resize: none">Именно с видеоголовой, высота до 1,8 м</textarea></sc-if><sc-if value="{{empty}}"><textarea id="d" rows="2" placeholder="Размер, цвет, модель, пожелания" style="box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 12px 14px; font-family: Onest, sans-serif; font-size: 15px; line-height: 1.4; color: #17181C; background: #FFFFFF; resize: none"></textarea></sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div role="radiogroup" aria-label="Приоритет" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">Приоритет</span>
<div style="display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 6px 0 4px; height: 50px; box-sizing: border-box">
<div style="display: flex; align-items: center">
<sc-for list="{{hearts}}" as="h" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{h.sel}}" aria-label="{{h.label}}" style="width: 40px; height: 44px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" style="fill:{{h.fill}};stroke:{{h.stroke}};stroke-width:1.6;stroke-linejoin:round" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"></path></svg></button></sc-for>
</div>
<span style="font-size: 14px; font-weight: 700; color: #4B3BC4; padding-right: 8px">Хочу</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="ls" style="font-size: 13px; font-weight: 600">Список</span>
<button type="button" aria-labelledby="ls" style="display: flex; align-items: center; gap: 10px; height: 50px; border: 1.5px solid #E2E1DB; border-radius: 14px; background: #FFFFFF; padding: 0 12px 0 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="ListIcon" kind="{{listIcon}}" color="{{listColor}}" size="16" box="34" hint-size="34px,34px"></dc-import><span style="flex: 1; font-size: 15px; font-weight: 600">{{listName}}</span><span style="font-size: 12px; color: #5E6066">{{listNote}}</span><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: {{barBottom}}px; padding: 12px 20px {{barPad}}px; background: #FFFFFF; box-shadow: 0 -1px 0 #EEEDE8">
<button type="button" style="width: 100%; height: 56px; border: none; border-radius: 18px; background: {{btnBg}}; color: {{btnFg}}; font-family: Onest, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">{{cta}}</button>
</div>
<sc-if value="{{keyboard}}"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #D1D3D9; display: flex; flex-direction: column; gap: 10px; padding: 10px 4px 0; box-sizing: border-box"><sc-for list="{{kbRows}}" as="r" hint-placeholder-count="4"><div style="display: flex; justify-content: center; gap: 5px"><sc-for list="{{r.keys}}" as="k" hint-placeholder-count="10"><span style="width: {{k.w}}px; height: 44px; border-radius: 6px; background: {{k.bg}}; box-shadow: 0 1px 0 #9A9CA2; display: flex; align-items: center; justify-content: center; font-size: {{k.fs}}px; color: #17181C">{{k.t}}</span></sc-for></div></sc-for></div></sc-if>
</section>
<sc-if value="{{hasDialog}}"><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.4)"></div><div style="position: absolute; left: 24px; right: 24px; top: 300px"><dc-import name="Dialog" title="{{dlgTitle}}" body="{{dlgBody}}" primary="Не сохранять" secondary="Продолжить" hint-size="342px,200px"></dc-import></div></sc-if>
<sc-if value="{{listPicker}}"><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.35)"></div><div role="dialog" aria-label="Список" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column; gap: 6px"><div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div><h2 style="margin: 8px 4px 2px; font-size: 18px; font-weight: 700">В какой список</h2><span style="margin: 4px 6px 0; font-size: 12px; font-weight: 700; color: #5E6066; text-transform: uppercase; letter-spacing: 0.04em">Мои списки</span><sc-for list="{{pickMine}}" as="l" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{l.sel}}" style="display: flex; align-items: center; gap: 12px; height: 54px; border: none; border-radius: 16px; padding: 0 12px 0 10px; background: {{l.bg}}; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="ListIcon" kind="{{l.icon}}" color="{{l.color}}" size="16" box="34" hint-size="34px,34px"></dc-import><span style="flex: 1; font-size: 15px; font-weight: 600">{{l.title}}</span><sc-if value="{{l.on}}"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if></button></sc-for><span style="margin: 10px 6px 0; font-size: 12px; font-weight: 700; color: #5E6066; text-transform: uppercase; letter-spacing: 0.04em">Совместные</span><sc-for list="{{pickShared}}" as="l" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; height: 54px; border: none; border-radius: 16px; padding: 0 12px 0 10px; background: transparent; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><dc-import name="ListIcon" kind="{{l.icon}}" color="{{l.color}}" size="16" box="34" hint-size="34px,34px"></dc-import><span style="flex: 1; font-size: 15px; font-weight: 600">{{l.title}}</span><dc-import name="AvatarStack" who="{{l.who}}" size="20" hint-size="34px,20px"></dc-import></button></sc-for><span style="margin: 8px 6px 0; font-size: 12px; color: #6B6D73">Списки, где вы зритель, сюда не попадают</span></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filled":{"editor":"boolean","default":true},"from":{"editor":"enum","options":["home","list"],"default":"home"},"photo":{"editor":"enum","options":["auto","none","ok","uploading","errType","errSize","small"],"default":"auto"},"nameError":{"editor":"boolean","default":false},"keyboard":{"editor":"boolean","default":false},"discard":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["add","edit"],"default":"add"},"listPicker":{"editor":"boolean","default":false},"shift":{"editor":"int","default":0},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filled = this.props.filled ?? true;
    const inList = (this.props.from ?? 'home') === 'list';
    let ph = this.props.photo ?? 'auto';
    if (ph === 'auto') ph = filled ? 'ok' : 'none';
    const edit = (this.props.mode ?? 'add') === 'edit';
    const nameError = !!this.props.nameError;
    const kb = !!this.props.keyboard;
    const row = (str, w) => ({ keys: str.split('').map((t) => ({ t, w: w, bg: '#FFFFFF', fs: 20 })) });
    const kbRows = [row('йцукенгшщзх', 29), row('фывапролджэ', 29), row('ячсмитьбю', 31), { keys: [{ t: '123', w: 80, bg: '#ADB0B7', fs: 15 }, { t: 'пробел', w: 170, bg: '#FFFFFF', fs: 15 }, { t: 'Готово', w: 90, bg: '#ADB0B7', fs: 15 }] }];
    const labels = ['Можно и без', 'Было бы неплохо', 'Хочу', 'Очень хочу', 'Мечта'];
    const hearts = [1, 2, 3, 4, 5].map((i) => ({
      fill: i <= 3 ? '#6E56F0' : 'none', stroke: i <= 3 ? '#6E56F0' : '#C9C2EE', sel: i === 3 ? 'true' : 'false', label: labels[i - 1]
    }));
    return {
      filled, empty: !filled,
      showPhoto: ['ok', 'uploading', 'small'].includes(ph), uploading: ph === 'uploading', smallWarn: ph === 'small',
      noPhoto: ['none', 'errType', 'errSize'].includes(ph), photoErr: ph === 'errType' || ph === 'errSize',
      photoErrText: ph === 'errType' ? 'Это не картинка. Выберите JPG, PNG или HEIC' : 'Файл больше 20 МБ. Выберите фото поменьше',
      dropBorder: (ph === 'errType' || ph === 'errSize') ? '#F3B5AE' : '#C9C7FF',
      nameError, nameInvalid: nameError ? 'true' : 'false',
      nameBorder: nameError ? '#D92D20' : '#17181C', nameBg: nameError ? '#FFF7F6' : '#FFFFFF',
      keyboard: kb, kbRows, barBottom: kb ? 300 : 0, barPad: kb ? 12 : 30,
      heading: edit ? 'Редактировать' : 'Новое желание', cta: edit ? 'Сохранить' : 'Добавить',
      hasDialog: !!this.props.discard,
      listPicker: !!this.props.listPicker,
      pickMine: [{ title: 'Мои желания', icon: 'heart', color: 'lavender' }, { title: 'День рождения', icon: 'cake', color: 'pink' }, { title: 'Для поездок', icon: 'plane', color: 'blue' }].map((l, i) => ({ ...l, on: i === 0, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#F4F4EF' : 'transparent' })),
      pickShared: [{ title: 'Для дома', icon: 'home', color: 'sand', who: ['vitaly', 'olesya'] }, { title: 'Новый год', icon: 'tree', color: 'mint', who: ['vitaly', 'olesya', 'anya'] }],
      dlgTitle: edit ? 'Не сохранять изменения?' : 'Не сохранять желание?',
      dlgBody: edit ? 'Изменения в карточке пропадут.' : 'Введённые данные пропадут.',
      titleVal: filled ? 'Штатив K&F Concept K254A7 с видеоголовой' : '',
      priceVal: filled ? '11 990' : '',
      urlVal: filled ? 'https://market.yandex.ru/card/shtativ-kf-concept-k254a7…' : '',
      hearts,
      listName: inList ? 'День рождения' : 'Мои желания',
      listIcon: inList ? 'cake' : 'heart',
      listColor: inList ? 'pink' : 'lavender',
      listNote: inList ? 'Этот список' : 'По умолчанию',
      shift: this.props.shift ?? 0,
      btnBg: (filled || nameError) ? '#C8F56A' : '#E6EFD0', btnFg: (filled || nameError) ? '#17181C' : '#5C6150'
    };
  }
}
</script>
</body>
</html>
