<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новое желание — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 100%; min-height: 960px; overflow: hidden; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true"><dc-import name="Desktop-Home" hint-size="100%,960px"></dc-import></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.38)"></div>

<section role="dialog" aria-label="Новое желание" style="position: absolute; left: 50%; top: 80px; transform: translateX(-50%); width: min(780px, calc(100% - 48px)); box-sizing: border-box; background: #FFFFFF; border-radius: 32px; padding: 28px 32px 30px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 30px 80px rgba(23, 24, 28, 0.25)">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.01em">Новое желание</h2>
<a href="Desktop-Home.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<a href="Desktop-Crop.dc.html" style="flex: 0 0 260px; height: 260px; box-sizing: border-box; border: {{dropBorder}}; border-radius: 24px; background: {{dropBg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; color: #17181C; text-decoration: none; text-align: center">
<span style="width: 60px; height: 60px; border-radius: 20px; background: #EEE9FF; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" style="stroke:#4B3BC4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.8"></circle><path d="M21 16l-5-5-8 9"></path></svg></span>
<span style="font-size: 16px; font-weight: 700">{{dropTitle}}</span>
<span style="font-size: 14px; color: #5E6066; line-height: 1.45">Перетащите сюда, вставьте скриншот <b style="white-space: nowrap; color: #17181C">⌘ V</b> или выберите файл</span><span style="font-size: 12px; color: #6B6D73">JPG, PNG или HEIC до 20 МБ. Подойдёт скриншот</span>
</a>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="t" style="font-size: 13px; font-weight: 600">Название <span aria-hidden="true" style="color: #D92D20">*</span></label>
<input id="t" type="text" required value="Клетка SmallRig 3538B для Sony ZV-E10" style="height: 50px; box-sizing: border-box; border: 1.5px solid #17181C; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p" style="font-size: 13px; font-weight: 600">Цена</label>
<div style="position: relative"><input id="p" type="text" inputmode="numeric" value="4 990" style="width: 100%; height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 40px 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C; background: #FFFFFF"><span aria-hidden="true" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 600; color: #5E6066">₽</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="u" style="font-size: 13px; font-weight: 600">Ссылка на товар</label>
<input id="u" type="url" placeholder="Чтобы подарили именно этот товар" style="height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 15px; color: #17181C; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="d" style="font-size: 13px; font-weight: 600">Описание</label>
<textarea id="d" rows="2" placeholder="Размер, цвет, модель, пожелания" style="box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 12px 14px; font-family: Onest, sans-serif; font-size: 15px; line-height: 1.4; color: #17181C; background: #FFFFFF; resize: none"></textarea>
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid #EEEDE8">
<div style="display: flex; flex-wrap: wrap; gap: 14px">
<div role="radiogroup" aria-label="Приоритет" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">Приоритет</span>
<div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 6px; border: 1.5px solid #E2E1DB; border-radius: 14px">
<sc-for list="{{hearts}}" as="h" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{h.sel}}" aria-label="{{h.label}}" style="width: 30px; height: 40px; border: none; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="19" height="19" viewBox="0 0 24 24" style="fill:{{h.fill}};stroke:{{h.stroke}};stroke-width:1.6;stroke-linejoin:round" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 10c0 5.65-7 10-7 10z"></path></svg></button></sc-for>
<span style="font-size: 14px; font-weight: 700; color: #4B3BC4; margin-left: 4px">Хочу</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="dl" style="font-size: 13px; font-weight: 600">Список</span>
<button type="button" aria-labelledby="dl" style="display: flex; align-items: center; gap: 10px; height: 46px; border: 1.5px solid #E2E1DB; border-radius: 14px; background: #FFFFFF; padding: 0 12px 0 6px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer"><dc-import name="ListIcon" kind="heart" color="lavender" size="15" box="30" hint-size="30px,30px"></dc-import><span style="font-size: 15px; font-weight: 600">Мои желания</span><svg width="14" height="14" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</div>
<button type="button" style="height: 52px; padding: 0 36px; border: none; border-radius: 16px; background: #C8F56A; color: #17181C; font-family: Onest, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">Добавить</button>
</div>
<sc-if value="{{drag}}"><div aria-hidden="true" style="position: absolute; left: 150px; top: 250px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 12px 30px rgba(23, 24, 28, 0.25); transform: rotate(-4deg)"><img src="/_blob/f25658efe17e73f758a76302c4077302" alt="" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover"><span style="font-size: 13px; font-weight: 600">smallrig.png</span></div></sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"drag":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Можно и без', 'Было бы неплохо', 'Хочу', 'Очень хочу', 'Мечта'];
    const drag = !!this.props.drag;
    return { drag, dropBorder: drag ? '2px solid #6E56F0' : '1.5px dashed #C9C7FF', dropBg: drag ? '#EEE9FF' : '#F7F5FF', dropTitle: drag ? 'Отпустите, чтобы добавить' : 'Добавить фото', hearts: [1, 2, 3, 4, 5].map((i) => ({ fill: i <= 3 ? '#6E56F0' : 'none', stroke: i <= 3 ? '#6E56F0' : '#C9C2EE', sel: i === 3 ? 'true' : 'false', label: labels[i - 1] })) };
  }
}
</script>
</body>
</html>
