<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Пригласить</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section role="dialog" aria-label="Пригласить в «Для дома»" style="width: {{w}}; box-sizing: border-box; background: #FFFFFF; border-radius: {{radius}}; padding: {{pad}}; font-family: Onest, sans-serif; color: #17181C; display: flex; flex-direction: column; gap: 14px; box-shadow: {{shadow}}">
<sc-if value="{{handle}}"><div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div></sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h2 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">Пригласить в «Для дома»</h2><button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<span style="font-size: 14px; color: #5E6066">Кем будет приглашённый?</span>
<div role="radiogroup" aria-label="Роль" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{r.sel}}" style="display: flex; align-items: center; gap: 12px; padding: 14px; border: {{r.border}}; border-radius: 18px; background: #FFFFFF; font-family: Onest, sans-serif; color: #17181C; cursor: pointer; text-align: left"><span style="width: 44px; height: 44px; flex: none; border-radius: 14px; background: {{r.iconBg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" style="stroke:{{r.iconFg}};stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="{{r.path}}"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{r.t}}</span><span style="font-size: 13px; color: #5E6066">{{r.d}}</span></span><span aria-hidden="true" style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 999px; border: {{r.dot}}; background: {{r.dotBg}}"></span></button></sc-for>
</div>
<sc-if value="{{chooseStep}}" hint-placeholder-val="{{ true }}"><a href="Shared-Invite-Link.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 18px; background: #C8F56A; color: #17181C; text-decoration: none; font-size: 16px; font-weight: 700">Создать ссылку</a></sc-if>
<sc-if value="{{linkStep}}"><div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; background: #F4F4EF; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" style="flex: none; stroke:#4B3BC4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mewish.app/i/7Kq2fXw9pLm3</span></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px"><button type="button" style="height: 52px; border: none; border-radius: 16px; background: #C8F56A; font-family: Onest, sans-serif; font-size: 15px; font-weight: 700; color: #17181C; cursor: pointer; white-space: nowrap">Скопировать ссылку</button><button type="button" style="height: 52px; border: none; border-radius: 16px; background: #17181C; font-family: Onest, sans-serif; font-size: 15px; font-weight: 600; color: #FFFFFF; cursor: pointer">Поделиться</button></div>
<span style="font-size: 13px; color: #5E6066; line-height: 1.4">Ссылка действует 7 дней. Её можно отозвать в «Участниках».</span>
</div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["choose","link"],"default":"choose"},"desktop":{"editor":"boolean","default":false},"$preview":{"width":390,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const link = (this.props.step ?? 'choose') === 'link';
    const dk = !!this.props.desktop;
    const roles = [
      { t: 'Редактор', d: 'Добавляет и меняет желания', path: 'M4 20h4L19 9l-4-4L4 16zM13 7l4 4', iconBg: '#EEE9FF', iconFg: '#4B3BC4' },
      { t: 'Зритель', d: 'Только смотрит', path: 'M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', iconBg: '#F4F4EF', iconFg: '#3A3B40' }
    ].map((r, i) => ({ ...r, sel: i === 0 ? 'true' : 'false', border: i === 0 ? '2px solid #17181C' : '1.5px solid #E2E1DB', dot: i === 0 ? '6px solid #17181C' : '1.5px solid #C9C8C2', dotBg: '#FFFFFF' }));
    return {
      roles, chooseStep: !link, linkStep: link,
      handle: !dk, w: dk ? '520px' : '390px', radius: dk ? '28px' : '28px 28px 0 0', pad: dk ? '24px' : '10px 20px 30px',
      shadow: dk ? '0 30px 80px rgba(23, 24, 28, 0.25)' : 'none'
    };
  }
}
</script>
</body>
</html>
