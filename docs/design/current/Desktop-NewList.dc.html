<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый список — компьютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 100%; min-height: 960px; overflow: hidden; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true"><sc-if value="{{isEdit}}"><dc-import name="Desktop-List" hint-size="100%,960px"></dc-import></sc-if><sc-if value="{{isCreate}}" hint-placeholder-val="{{ true }}"><dc-import name="Desktop-Home" hint-size="100%,960px"></dc-import></sc-if></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.38)"></div>

<section role="dialog" aria-label="{{heading}}" style="position: absolute; left: 50%; top: {{top}}px; transform: translateX(-50%); width: min(700px, calc(100% - 48px)); box-sizing: border-box; background: #FFFFFF; border-radius: 32px; padding: 26px 30px 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 80px rgba(23, 24, 28, 0.25)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 24px; font-weight: 700; white-space: nowrap">{{heading}}</h2>
<a href="Desktop-Home.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="n" style="font-size: 13px; font-weight: 600">Название <span aria-hidden="true" style="color: #D92D20">*</span></label>
<div style="display: flex; align-items: center; gap: 10px">
<dc-import name="ListIcon" kind="{{icon}}" color="{{color}}" size="24" box="50" hint-size="50px,50px"></dc-import>
<input id="n" type="text" required value="{{nameVal}}" style="flex: 1; min-width: 0; height: 50px; box-sizing: border-box; border: 1.5px solid #17181C; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C; background: #FFFFFF">
</div>
</div>
<div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="ds" style="font-size: 13px; font-weight: 600">Описание</label><input id="ds" type="text" placeholder="О чём этот список" style="height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 15px; background: #FFFFFF"></div>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px"><span id="dtl" style="font-size: 13px; font-weight: 600">Дата события</span><a href="Desktop-NewList-Date.dc.html" aria-labelledby="dtl" aria-haspopup="dialog" style="display: flex; align-items: center; justify-content: space-between; height: 50px; box-sizing: border-box; border: 1.5px solid {{dateBorder}}; border-radius: 14px; padding: 0 14px; color: #17181C; text-decoration: none; font-size: 15px; white-space: nowrap">{{dateText}}<svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#5E6066;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></a>
<sc-if value="{{showDate}}"><div style="position: absolute; z-index: 6; right: 0; top: 80px"><dc-import name="DatePicker" selected="28" hint-size="320px,390px"></dc-import></div></sc-if>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Иконка</span>
<div role="radiogroup" aria-label="Иконка списка" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="30"><button type="button" role="radio" aria-checked="{{i.sel}}" aria-label="{{i.name}}" style="height: 50px; border: none; border-radius: 14px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="ListIcon" kind="{{i.k}}" color="{{i.c}}" selected="{{i.on}}" size="19" box="44" hint-size="44px,44px"></dc-import></button></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Цвет</span>
<div role="radiogroup" aria-label="Цвет списка" style="display: flex; gap: 10px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="8"><button type="button" role="radio" aria-checked="{{c.sel}}" aria-label="{{c.name}}" style="width: 38px; height: 38px; border: none; border-radius: 999px; background: {{c.bg}}; box-shadow: {{c.ring}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 13px; height: 13px; border-radius: 999px; background: {{c.fg}}"></span></button></sc-for>
</div>
</div>
<sc-if value="{{isEdit}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Обложка</span>
<div style="display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap">
<div role="radiogroup" aria-label="Обложка" style="display: grid; grid-template-columns: repeat(2, 150px); gap: 8px">
<button type="button" role="radio" aria-checked="true" style="display: flex; flex-direction: column; gap: 6px; border: 2px solid #17181C; border-radius: 16px; background: #FFFFFF; padding: 5px 5px 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer">
<span style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 80px; border-radius: 11px; overflow: hidden"><img src="/_blob/9dd5ad4fd07e6e2459673d541a820d4c" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/e54b0aa006235c5f815fe0e014f464ff" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/3f5d836a287dd08dfc5d2f75a0f2e53b" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/469af2bdbd969601fd8987c702f8c7aa" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<span style="font-size: 13px; font-weight: 600">Коллаж</span></button>
<button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; gap: 6px; border: 1.5px solid #E2E1DB; border-radius: 16px; background: #FFFFFF; padding: 5px 5px 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer">
<span style="height: 80px; border-radius: 11px; background: #F0F6FF; display: flex; align-items: center; justify-content: center"><dc-import name="ListIcon" kind="plane" color="blue" size="20" box="40" hint-size="40px,40px"></dc-import></span>
<span style="font-size: 13px; font-weight: 600">Иконка</span></button>
</div>
</div>
</div>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 4px">
<sc-if value="{{isEdit}}"><button type="button" style="height: 48px; padding: 0 18px; border: 1.5px solid #F3C9C4; border-radius: 14px; background: #FFFFFF; font-family: Onest, sans-serif; font-size: 15px; font-weight: 600; color: #B42318; cursor: pointer; white-space: nowrap">Удалить список</button></sc-if>
<span aria-hidden="true" style="flex: 1"></span>
<button type="button" style="height: 52px; padding: 0 32px; border: none; border-radius: 16px; background: #C8F56A; color: #17181C; font-family: Onest, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; white-space: nowrap">{{cta}}</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["create","edit"],"default":"create"},"date":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const edit = (this.props.mode ?? 'create') === 'edit';
    const showDate = !!this.props.date;
    const color = 'blue';
    const names = {
      heart: 'Сердце', gift: 'Подарок', cake: 'День рождения', home: 'Дом', plane: 'Путешествия', suitcase: 'Поездки',
      shirt: 'Одежда', sneaker: 'Обувь', tech: 'Техника', phone: 'Гаджеты', camera: 'Фото', book: 'Книги',
      dumbbell: 'Спорт', ball: 'Игры с мячом', child: 'Ребёнок', ring: 'Свадьба', tree: 'Новый год', star: 'Особое',
      sparkles: 'Впечатления', music: 'Музыка', game: 'Игры', paw: 'Питомцы', coffee: 'Кофе', pot: 'Кухня',
      flower: 'Цветы', palette: 'Творчество', car: 'Авто', bike: 'Велосипед', tent: 'Походы', gem: 'Украшения'
    };
    const icons = Object.keys(names).map((k) => ({ k, name: names[k], c: k === 'plane' ? color : 'gray', on: k === 'plane', sel: k === 'plane' ? 'true' : 'false' }));
    const cn = { lavender: 'Лавандовый', lime: 'Лаймовый', pink: 'Розовый', blue: 'Голубой', peach: 'Персиковый', mint: 'Мятный', sand: 'Песочный', gray: 'Серый' };
    const C = { lavender: ['#EEE9FF', '#4B3BC4'], lime: ['#EEF8D6', '#3F6212'], pink: ['#FFE8EE', '#A3234B'], blue: ['#E6F0FF', '#1E4FA8'], peach: ['#FFEEDD', '#9A4416'], mint: ['#E1F5EC', '#1F6B4F'], sand: ['#F3EEE4', '#6B5226'], gray: ['#EEEEEA', '#3A3B40'] };
    const colors = Object.keys(cn).map((k) => ({ name: cn[k], bg: C[k][0], fg: C[k][1], sel: k === color ? 'true' : 'false', ring: k === color ? '0 0 0 2px #FFFFFF, 0 0 0 4px #17181C' : 'none' }));
    return {
      heading: edit ? 'Настройки списка' : 'Новый список',
      cta: edit ? 'Сохранить' : 'Создать список',
      isEdit: edit, icons, colors, icon: 'plane', color,
      nameVal: 'Для поездок',
      showDate,
      dateText: (edit || showDate) ? '28 ноября 2026' : 'Не выбрана',
      dateBorder: showDate ? '#17181C' : '#E2E1DB',
      isCreate: !edit,
      top: edit ? 40 : 60
    };
  }
}
</script>
</body>
</html>
