<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Участники</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<section role="dialog" aria-label="Участники" style="position: relative; width: {{w}}; box-sizing: border-box; background: #FFFFFF; border-radius: {{radius}}; padding: {{pad}}; font-family: Onest, sans-serif; color: #17181C; display: flex; flex-direction: column; gap: 14px; box-shadow: {{shadow}}">
<sc-if value="{{handle}}"><div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div></sc-if>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h2 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">Участники · Для дома</h2><button type="button" aria-label="Закрыть" style="width: 44px; height: 44px; flex: none; border: none; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<sc-if value="{{one}}"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px 6px; text-align: center; border-radius: 22px; background: #F7F5FF"><div style="display: flex; align-items: center; gap: 6px"><dc-import name="Avatar" who="vitaly" size="48" hint-size="48px,48px"></dc-import><span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 999px; border: 2px dashed #B9A8FF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" style="stroke:#6E56F0;stroke-width:2;stroke-linecap:round;fill:none"><path d="M12 5v14M5 12h14"></path></svg></span></div><span style="font-size: 17px; font-weight: 700">Пригласите Олесю — ведите список вместе</span><span style="font-size: 14px; color: #5E6066; line-height: 1.4">Вы пока единственный участник. Отправьте ссылку — она действует 7 дней.</span></div></sc-if>
<div style="display: flex; flex-direction: column">
<sc-for list="{{people}}" as="u" hint-placeholder-count="2"><div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; border-bottom: 1px solid #EEEDE8"><dc-import name="Avatar" who="{{u.who}}" size="40" hint-size="40px,40px"></dc-import><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; white-space: nowrap">{{u.name}}<span style="font-weight: 400; color: #5E6066">{{u.you}}</span></span><span style="font-size: 13px; color: #5E6066">{{u.role}}</span></span><sc-if value="{{u.act}}"><button type="button" aria-label="Действия с участником {{u.name}}" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: {{u.bg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:3;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button></sc-if>
<sc-if value="{{u.menu}}"><div role="menu" aria-label="Действия с участником" style="position: absolute; z-index: 5; right: 0; top: 54px; width: 230px; background: #FFFFFF; border-radius: 18px; padding: 6px; box-shadow: 0 16px 40px rgba(23, 24, 28, 0.2), 0 0 0 1px #EEEDE8; display: flex; flex-direction: column"><button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 46px; border: none; border-radius: 12px; padding: 0 12px; background: #F4F4EF; font-family: Onest, sans-serif; font-size: 15px; color: #17181C; cursor: pointer; text-align: left">Сделать зрителем</button><div aria-hidden="true" style="height: 1px; background: #EEEDE8; margin: 4px 8px"></div><a href="Shared-Dialog-Remove.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 12px; padding: 0 12px; font-size: 15px; color: #B42318; text-decoration: none">Убрать из списка</a></div></sc-if></div></sc-for>
</div>
<sc-if value="{{links}}"><div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #5E6066">Ссылки-приглашения</span><div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; border-radius: 16px; background: #F4F4EF"><svg width="20" height="20" viewBox="0 0 24 24" style="flex: none; stroke:#4B3BC4;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"></path></svg><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 600">Для редактора</span><span style="font-size: 12px; color: #5E6066">действует до 1 декабря</span></span><button type="button" style="height: 40px; padding: 0 12px; border: none; border-radius: 12px; background: #FFFFFF; font-family: Onest, sans-serif; font-size: 13px; font-weight: 600; color: #17181C; cursor: pointer">Скопировать</button><button type="button" style="height: 40px; padding: 0 10px; border: none; border-radius: 12px; background: transparent; font-family: Onest, sans-serif; font-size: 13px; font-weight: 600; color: #B42318; cursor: pointer">Отозвать</button></div></div></sc-if>
<sc-if value="{{canInvite}}" hint-placeholder-val="{{ true }}"><a href="Shared-Invite-Role.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 18px; background: #C8F56A; color: #17181C; text-decoration: none; font-size: 16px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2.2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Пригласить</a></sc-if>
<sc-if value="{{viewer}}"><a href="Shared-Dialog-Leave.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 16px; box-shadow: inset 0 0 0 1.5px #F3C9C4; color: #B42318; text-decoration: none; font-size: 15px; font-weight: 600">Выйти из списка</a></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["one","many","viewer"],"default":"many"},"menu":{"editor":"boolean","default":false},"desktop":{"editor":"boolean","default":false},"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'many';
    const dk = !!this.props.desktop;
    const viewer = st === 'viewer';
    const all = [
      { who: 'vitaly', name: 'Виталий', you: viewer ? '' : ' · вы', role: 'Редактор', act: false },
      { who: 'olesya', name: 'Олеся', you: '', role: 'Редактор', act: !viewer },
      { who: 'anya', name: 'Аня', you: viewer ? ' · вы' : '', role: 'Зритель', act: !viewer }
    ];
    const people = (st === 'one' ? all.slice(0, 1) : all).map((u, i) => ({ ...u, menu: !!this.props.menu && i === 1, bg: (!!this.props.menu && i === 1) ? '#EEE9FF' : '#F4F4EF' }));
    return {
      one: st === 'one', viewer, canInvite: !viewer, links: st === 'many', people,
      handle: !dk, w: dk ? '520px' : '390px', radius: dk ? '28px' : '28px 28px 0 0', pad: dk ? '24px' : '10px 20px 30px',
      shadow: dk ? '0 30px 80px rgba(23, 24, 28, 0.25)' : 'none'
    };
  }
}
</script>
</body>
</html>
