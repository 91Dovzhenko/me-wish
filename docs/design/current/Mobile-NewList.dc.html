<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Новый список — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=Unbounded:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #F4F4EF; font-family: Onest, sans-serif; color: #17181C">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(23, 24, 28, 0.35)"></div>
<section role="dialog" aria-label="{{heading}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; background: #FFFFFF; border-radius: 32px 32px 0 0; overflow: hidden">
<div aria-hidden="true" style="position: absolute; z-index: 2; left: 50%; top: 10px; margin-left: -20px; width: 40px; height: 5px; border-radius: 999px; background: #D9D8D2"></div>
<div style="padding: 24px 20px 130px; display: flex; flex-direction: column; gap: 16px; transform: translateY({{shift}}px)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700; white-space: nowrap">{{heading}}</h2>
<a href="Main.dc.html" aria-label="Закрыть" style="width: 44px; height: 44px; flex: none; border-radius: 999px; background: #F4F4EF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" style="stroke:#17181C;stroke-width:2;stroke-linecap:round;fill:none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="n" style="font-size: 13px; font-weight: 600">Название <span aria-hidden="true" style="color: #D92D20">*</span></label>
<div style="display: flex; align-items: center; gap: 10px">
<dc-import name="ListIcon" kind="cake" color="pink" size="24" box="50" hint-size="50px,50px"></dc-import>
<input id="n" type="text" required value="День рождения" style="flex: 1; min-width: 0; height: 50px; box-sizing: border-box; border: 1.5px solid #17181C; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 16px; color: #17181C; background: #FFFFFF">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ds" style="font-size: 13px; font-weight: 600">Описание</label>
<sc-if value="{{isEdit}}"><input id="ds" type="text" value="Идеи к 35-летию" style="width: 100%; height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 15px; color: #17181C; background: #FFFFFF"></sc-if>
<sc-if value="{{isCreate}}" hint-placeholder-val="{{ true }}"><input id="ds" type="text" placeholder="Например, идеи к 35-летию" style="width: 100%; height: 50px; box-sizing: border-box; border: 1.5px solid #E2E1DB; border-radius: 14px; padding: 0 14px; font-family: Onest, sans-serif; font-size: 15px; color: #17181C; background: #FFFFFF"></sc-if>
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<span id="dtl" style="font-size: 13px; font-weight: 600">Дата события</span>
<a href="Mobile-NewList-Date.dc.html" aria-labelledby="dtl" aria-haspopup="dialog" style="display: flex; align-items: center; justify-content: space-between; height: 50px; box-sizing: border-box; border: 1.5px solid {{dateBorder}}; border-radius: 14px; padding: 0 14px; color: #17181C; text-decoration: none; font-size: 15px; white-space: nowrap">{{dateText}}<svg width="18" height="18" viewBox="0 0 24 24" style="stroke:#5E6066;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></a>
<sc-if value="{{showDate}}"><div style="position: absolute; z-index: 6; left: 0; top: 80px"><dc-import name="DatePicker" selected="28" hint-size="320px,390px"></dc-import></div></sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Иконка</span>
<div role="radiogroup" aria-label="Иконка списка" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{icons}}" as="i" hint-placeholder-count="30"><button type="button" role="radio" aria-checked="{{i.sel}}" aria-label="{{i.name}}" style="height: 48px; border: none; border-radius: 14px; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer"><dc-import name="ListIcon" kind="{{i.k}}" color="{{i.c}}" selected="{{i.on}}" size="20" box="44" hint-size="44px,44px"></dc-import></button></sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Цвет</span>
<div role="radiogroup" aria-label="Цвет списка" style="display: flex; justify-content: space-between">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="8"><button type="button" role="radio" aria-checked="{{c.sel}}" aria-label="{{c.name}}" style="width: 40px; height: 40px; border: none; border-radius: 999px; background: {{c.bg}}; box-shadow: {{c.ring}}; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 999px; background: {{c.fg}}"></span></button></sc-for>
</div>
</div>

<sc-if value="{{isEdit}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600">Обложка</span>
<div role="radiogroup" aria-label="Обложка" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="true" style="display: flex; flex-direction: column; gap: 6px; border: 2px solid #17181C; border-radius: 16px; background: #FFFFFF; padding: 5px 5px 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer">
<span style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 72px; border-radius: 11px; overflow: hidden"><img src="/_blob/03eedffd0817baec9d1af3bb68440273" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/469af2bdbd969601fd8987c702f8c7aa" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/e54b0aa006235c5f815fe0e014f464ff" alt="" style="width: 100%; height: 100%; object-fit: cover"><img src="/_blob/f25658efe17e73f758a76302c4077302" alt="" style="width: 100%; height: 100%; object-fit: cover"></span>
<span style="font-size: 13px; font-weight: 600">Коллаж · 4 последних желания</span>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; flex-direction: column; gap: 6px; border: 1.5px solid #E2E1DB; border-radius: 16px; background: #FFFFFF; padding: 5px 5px 8px; font-family: Onest, sans-serif; color: #17181C; cursor: pointer">
<span style="height: 72px; border-radius: 11px; background: #FFF2F5; display: flex; align-items: center; justify-content: center"><dc-import name="ListIcon" kind="cake" color="pink" size="20" box="40" hint-size="40px,40px"></dc-import></span>
<span style="font-size: 13px; font-weight: 600">Иконка</span>
</button>
</div>
</div>
<button type="button" style="height: 50px; border: 1.5px solid #F3C9C4; border-radius: 16px; background: #FFFFFF; font-family: Onest, sans-serif; font-size: 15px; font-weight: 600; color: #B42318; cursor: pointer">Удалить список</button>
</sc-if>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 30px; background: #FFFFFF; box-shadow: 0 -1px 0 #EEEDE8">
<button type="button" style="width: 100%; height: 56px; border: none; border-radius: 18px; background: #C8F56A; color: #17181C; font-family: Onest, sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">{{cta}}</button>
</div>
<sc-if value="{{showDate}}"><div aria-hidden="true" style="position: absolute; inset: 0; z-index: 5; background: rgba(23, 24, 28, 0.08); pointer-events: none"></div></sc-if>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["create","edit"],"default":"create"},"shift":{"editor":"int","default":0},"date":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const edit = (this.props.mode ?? 'create') === 'edit';
    const showDate = !!this.props.date;
    const color = 'pink';
    const names = {
      heart: 'Сердце', gift: 'Подарок', cake: 'День рождения', home: 'Дом', plane: 'Путешествия', suitcase: 'Поездки',
      shirt: 'Одежда', sneaker: 'Обувь', tech: 'Техника', phone: 'Гаджеты', camera: 'Фото', book: 'Книги',
      dumbbell: 'Спорт', ball: 'Игры с мячом', child: 'Ребёнок', ring: 'Свадьба', tree: 'Новый год', star: 'Особое',
      sparkles: 'Впечатления', music: 'Музыка', game: 'Игры', paw: 'Питомцы', coffee: 'Кофе', pot: 'Кухня',
      flower: 'Цветы', palette: 'Творчество', car: 'Авто', bike: 'Велосипед', tent: 'Походы', gem: 'Украшения'
    };
    const icons = Object.keys(names).map((k) => ({ k, name: names[k], c: k === 'cake' ? color : 'gray', on: k === 'cake', sel: k === 'cake' ? 'true' : 'false' }));
    const cn = { lavender: 'Лавандовый', lime: 'Лаймовый', pink: 'Розовый', blue: 'Голубой', peach: 'Персиковый', mint: 'Мятный', sand: 'Песочный', gray: 'Серый' };
    const C = { lavender: ['#EEE9FF', '#4B3BC4'], lime: ['#EEF8D6', '#3F6212'], pink: ['#FFE8EE', '#A3234B'], blue: ['#E6F0FF', '#1E4FA8'], peach: ['#FFEEDD', '#9A4416'], mint: ['#E1F5EC', '#1F6B4F'], sand: ['#F3EEE4', '#6B5226'], gray: ['#EEEEEA', '#3A3B40'] };
    const colors = Object.keys(cn).map((k) => ({ name: cn[k], bg: C[k][0], fg: C[k][1], sel: k === color ? 'true' : 'false', ring: k === color ? '0 0 0 2px #FFFFFF, 0 0 0 4px #17181C' : 'none' }));
    const SRC = { p6: '/_blob/03eedffd0817baec9d1af3bb68440273', p4: '/_blob/e54b0aa006235c5f815fe0e014f464ff', p3: '/_blob/f25658efe17e73f758a76302c4077302', p1: '/_blob/469af2bdbd969601fd8987c702f8c7aa', p2: '/_blob/3f5d836a287dd08dfc5d2f75a0f2e53b' };
    const coverPics = ['p6', 'p4', 'p3', 'p1', 'p2'].map((k, i) => ({ src: SRC[k], name: 'Фото ' + (i + 1), sel: i === 0 ? 'true' : 'false', ring: i === 0 ? '2.5px solid #17181C' : 'none' }));
    return {
      heading: edit ? 'Настройки списка' : 'Новый список',
      cta: edit ? 'Сохранить' : 'Создать список',
      isEdit: edit, isCreate: !edit, icons, colors, coverPics,
      showDate,
      dateText: (edit || showDate) ? '28 ноября 2026' : 'Не выбрана',
      dateBorder: showDate ? '#17181C' : '#E2E1DB',
      shift: this.props.shift ?? 0
    };
  }
}
</script>
</body>
</html>
