<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ME:WISH</title>
    <meta name="description" content="Списки желаний, где карточка создаётся из ссылки" />
    <link rel="icon" type="image/svg+xml" href="/me-wish/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/me-wish/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f4ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ME:WISH" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Возврат после 404.html (GitHub Pages): восстанавливаем исходный адрес без перезагрузки.
      ;(function () {
        var p = new URLSearchParams(window.location.search).get('__redirect')
        if (p) {
          window.history.replaceState(null, '', '/me-wish/' + p.replace(/^\/+/, ''))
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
